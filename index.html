<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 50px auto;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        img {
            width: 120px;
            border-radius: 50%;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: gray;
        }

        button {
            background: black;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="photo.jpg" alt="Profile">

    <h1>Your Name</h1>
    <p>Full Stack Developer 💻</p>

    <button>Contact Me</button>

</div>

</body>
</html>
